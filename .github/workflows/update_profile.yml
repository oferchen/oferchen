name: Update Profile SVGs

on:
  schedule:
    # Daily, shortly after the UTC rollover; off the top of the hour, where scheduled runs get delayed
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/update_profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure cache & assets directories exist
        run: mkdir -p cache assets

      - name: Fetch live GitHub stats, avatar URL & contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/fetch_stats.py

      - name: Convert GitHub profile picture to dark & light ASCII art
        env:
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/build_ascii.py

      - name: Build Neofetch Card, Link Buttons, and Pac-Man Board SVGs
        run: |
          python tools/build_card.py
          python tools/build_links.py
          python tools/build_pacman.py

      - name: Commit and push updated SVGs & ASCII portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.svg assets/avatar.png assets/ascii-art*.txt cache/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update live profile stats, avatar ASCII art, and SVGs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes detected in generated assets."
          fi
