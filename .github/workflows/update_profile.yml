name: Update Profile SVGs

on:
  schedule:
    # Run automatically every 24 hours at 00:00 UTC (rolls over with GitHub contribution calendar)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/update_profile.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (requests & Pillow for Avatar-to-ASCII conversion)
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Ensure cache & assets directories exist
        run: mkdir -p cache assets

      - name: Fetch live GitHub stats, avatar URL & contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/fetch_stats.py

      - name: Convert GitHub Profile Picture to 87x47 Dark & Light ASCII Art
        env:
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/build_ascii.py

      - name: Build Neofetch Card, Link Buttons, and Pac-Man Board SVGs
        run: |
          python tools/build_card.py
          python tools/build_links.py
          python tools/build_pacman.py

      - name: Commit and push updated SVGs & ASCII portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg assets/ascii-art* cache/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update live profile stats, avatar ASCII art, and SVGs [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in generated assets."
          fi
